name: 777XSZ responsive browser QA
on:
  push:
    branches: [premium-cinematic-site-v2]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test every route at mobile, tablet and desktop sizes
        env:
          QA_OUTPUT: qa-screenshots
        run: node scripts/browser-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-screenshots
          path: qa-screenshots/
          if-no-files-found: ignore
