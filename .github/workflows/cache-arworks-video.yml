name: Cache AR Works video

on:
  push:
    paths:
      - '.github/workflows/cache-arworks-video.yml'

permissions:
  contents: write

jobs:
  cache-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download AR Works video
        run: |
          curl -L --fail --retry 3 'https://static.metricool.com/planner/202610/7237186-file-582162800735096527.mp4' -o ar-works-business.mp4
          test -s ar-works-business.mp4

      - name: Commit video into repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ar-works-business.mp4
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Cache AR Works video locally'
          git push
