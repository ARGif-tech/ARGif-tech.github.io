name: 777XSZ site smoke checks
on:
  push:
    branches: [main, premium-cinematic-site-v2]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  site-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all primary pages, local links and sitemap
        run: python3 scripts/check-site.py
