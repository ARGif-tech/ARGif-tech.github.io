name: 777xsz live motion WebKit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps webkit chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/777xsz.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          status=0
          node scripts/motion-webkit.cjs || status=1
          node scripts/pricing-webkit.cjs || status=1
          node scripts/identity-webkit.cjs || status=1
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 777xsz-signal-screenshots
          path: test-screenshots/
          if-no-files-found: ignore
