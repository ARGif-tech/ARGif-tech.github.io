<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>AR Works — комплект соцсетей</title><style>body{margin:0;background:#091722;color:#edf3ef;font:17px/1.6 system-ui}main{max-width:1100px;margin:auto;padding:50px 24px}h1{font-size:42px;line-height:1.15}a{color:#8ac6a5}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}img{width:100%;display:block}h2{margin-top:50px}.cover{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.cover{grid-template-columns:1fr}}</style><main><a href="/">← Сайт AR Works</a><h1>Готовый комплект соцсетей</h1><p>Три карусели, Stories, аватар, обложки актуального и баннеры. Санитарное обслуживание бизнеса в Астане и пригороде.</p><p><a href="social-copy.md">Биографии, подписи и порядок публикации</a></p><div id="slides"></div><h2>Оформление профилей</h2><div class="cover"><img src="assets/avatar.jpg" alt="Аватар"><img src="assets/facebook-cover.jpg" alt="Facebook-обложка"><img src="assets/youtube-banner.jpg" alt="YouTube-баннер"></div><h2>Stories</h2><div class="cover"><img src="assets/story-01.jpg" alt="Объекты"><img src="assets/story-02.jpg" alt="Первый запрос"><img src="assets/story-03.jpg" alt="До согласования"></div></main><script>const titles=['Кто мы','С чего начать','До согласования'];document.getElementById('slides').innerHTML=titles.map((t,i)=>'<h2>'+t+'</h2><div class="grid">'+[1,2,3,4].map(j=>'<a href="assets/0'+(i+1)+'-0'+j+'.jpg"><img loading="lazy" src="assets/0'+(i+1)+'-0'+j+'.jpg" alt="'+t+', слайд '+j+'"></a>').join('')+'</div>').join('');</script></html>
